<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Panel de Control</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body admin-layout">
    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="admin" class="nav-link admin-link" style="color: #ffaa00;">Panel Admin</a>
            <div class="sidebar-divider"></div>
            <a href="home" class="nav-link">Inicio</a>
            <a href="my-teams" class="nav-link">Equipos</a>
            <a href="leagues" class="nav-link">Ligas</a>
            <a href="rules" class="nav-link">Reglas</a>
            <a href="profile" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="index" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>
    
    <!-- Header -->
    <header class="app-header">
        <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Panel de Control</h1>
        <a href="profile" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="dashboard-container">
        <div class="decorated-heading">
            <h2>Carga de Resultados</h2>
            <span class="heading-tag">Temporada 2026</span>
        </div>

        <!-- Contenedor dinámico de carreras -->
        <div id="admin-races-container" class="admin-races-list">
            <!-- Las tarjetas de carreras se cargarán acá -->
        </div>
    </main>
    
    <script src="./js/sidebar.js"></script>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
