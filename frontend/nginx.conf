server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Intenta buscar el archivo exacto, luego con la extensión .html, y si no existe redirige a 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}