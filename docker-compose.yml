services:
  # DATABASE
  db:
    image: postgres:17
    container_name: f2fantasy_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # BACKEND
  backend:
    build: ./backend
    container_name: f2_backend
    ports:
      - "${BACK_PORT}:5000"
    env_file:
      - .env   
    depends_on:
      - db

  # FRONTEND
  frontend:
    build: ./frontend
    container_name: f2_frontend
    restart: always
    ports:
      - "${FRONT_PORT}:80" # puerto 80 del contenedor al 3000

volumes:
  pgdata: