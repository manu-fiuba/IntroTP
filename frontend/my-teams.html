<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Home</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

    <!-- Tipografía Titillium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">
    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div> <!-- Overlay oscuro para el fondo -->

    <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="home" class="nav-link">Inicio</a>
            <a href="my-teams" class="nav-link">Equipos</a>
            <a href="leagues" class="nav-link">Ligas</a>
            <a href="rules" class="nav-link">Reglas</a>
            <a href="profile" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="index" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>
    
    <!-- Header -->
    <header class="app-header">
        <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Equipos</h1>
        <a href="profile" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="dashboard-container">
        <section class="grid-3-cols">
            
            <!-- Equipo 1 -->
            <article class="team-card">
                <div class="team-header">
                    <span class="team-t-badge">T1</span>
                    <h3 class="team-name">Mi equipo</h3>
                </div>
                <div class="total-pts-box">
                    1796 PTS
                </div>
                <div class="transfer-info">
                    <span>Presupuesto Restante</span>
                    <strong>$4.5M</strong>
                </div>
                <div class="transfer-info">
                    <span>Valor del Equipo</span>
                    <strong>$102.1M</strong>
                </div>
                <!-- Gestionar Equipo-->
                <div class="team-footer mt-1" style="margin-top: 1rem;">
                    <a href="manage-team" class="btn btn-outline btn-full text-center" style="width: 100%;">Gestionar Equipo</a>
                </div>
            </article>

            <!-- Equipo 2 -->
            <article class="team-card">
                <div class="team-header">
                    <span class="team-t-badge">T2</span>
                    <h3 class="team-name">Escudería Huevo</h3>
                </div>
                <div class="total-pts-box">
                    1876 PTS
                </div>
                <div class="transfer-info">
                    <span>Presupuesto Restante</span>
                    <strong>$0.5M</strong>
                </div>
                <div class="transfer-info">
                    <span>Valor del Equipo</span>
                    <strong>$105.8M</strong>
                </div>
                <div class="team-footer mt-1" style="margin-top: 1rem;">
                    <a href="manage-team" class="btn btn-outline btn-full text-center" style="width: 100%;">Gestionar Equipo</a>
                </div>
            </article>

            <!-- Botón de Slot Vacío -->
            <a href="create-team" class="team-card empty-slot">
                <div class="empty-content">
                    <span class="plus-icon">+</span>
                    <h3>Crear nuevo equipo</h3>
                    <p>Slot disponible</p>
                </div>
            </a>

        </section>
    </main>

    <script src="./js/sidebar.js"></script>
</body>
</html>
