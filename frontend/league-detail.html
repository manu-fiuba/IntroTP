<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Amigos de la Facu</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">
    
    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div> <!-- Overlay oscuro para el fondo -->

    <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="home.html" class="nav-link">Inicio</a>
            <a href="my-teams.html" class="nav-link">Equipos</a>
            <a href="leagues.html" class="nav-link">Ligas</a>
            <a href="rules.html" class="nav-link">Reglas</a>
            <a href="profile.html" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="index.html" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>

    <!-- Header con botón de retroceso opcional o menú -->
    <header class="app-header">
        <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Detalle de Liga</h1>
        <a href="profile.html" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="league-detail-container">

        <p class="form-error" id="leagueDetailError"></p>

        <!-- Tarjeta de Información de la Liga -->
        <section class="league-info-card" id="leagueInfoCard" style="display: none;">
            <div class="league-info-header">
                <h2 class="league-title-large" id="leagueTitle"></h2>
                
                <div class="league-position-badge-blue" id="leaguePositionBadge" style="display: none;">
                    <strong id="leaguePosition"></strong>
                </div>
            </div>
            
            <p class="league-desc-text" id="leagueDesc"></p>
            
            <div class="league-meta-grid">
                <div class="meta-item">
                    <span class="meta-label">Administrador</span>
                    <span class="meta-value" id="leagueOwner"></span>
                </div>
                <div class="meta-item" id="myTeamMeta" style="display: none;">
                    <span class="meta-label">Tu Equipo</span>
                    <span class="meta-value" id="leagueMyTeam"></span>
                </div>

                <div class="meta-item col-span-full" id="joinCodeMeta" style="display: none;">
                    <span class="meta-label">Código de invitación</span>
                    <div class="join-code-box" id="leagueJoinCode"></div>
                </div>
            </div>
        </section>

        <!-- Tabla de Posiciones -->
        <section class="leaderboard-section" id="leaderboardSection" style="display: none;">
            <h3 class="section-subtitle">Tabla de Posiciones</h3>
            
            <div class="table-responsive">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th class="col-pos">#</th>
                            <th class="col-team">Participante</th>
                            <th class="col-pts">Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </section>

        <!-- Abandonar -->
        <section class="danger-zone" id="dangerZone" style="display: none;">
            <button class="btn btn-danger btn-full" id="leaveLeagueBtn">Abandonar Liga</button>
        </section>

    </main>

    <script src="./js/sidebar.js"></script>
    <script src="./js/data/mock-data.js"></script>
    <script src="./js/data/api.js"></script>
    <script src="./js/pages/league-detail.js"></script>
</body>
</html>
