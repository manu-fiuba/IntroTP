<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Perfil</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

    <!-- Tipografía Titillium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">
    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div> <!-- Overlay oscuro para el fondo -->

    <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="home" class="nav-link">Inicio</a>
            <a href="my-teams" class="nav-link">Equipos</a>
            <a href="leagues" class="nav-link">Ligas</a>
            <a href="rules" class="nav-link">Reglas</a>
            <a href="profile" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="/" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>
    
    <!-- Header -->
    <header class="app-header">
        <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Perfil</h1>
        <a href="home" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="profile-container">

        <!-- Box con foto, nombre y arroba -->
        <section class="profile-card">
            <img src="./img/circle-user.svg" alt="Foto de perfil" class="profile-avatar">
            <h2 class="profile-name" id="profileName">Cargando...</h2>
            <span class="profile-username" id="profileUsername"></span>
        </section>

        <!-- Formulario para editar los datos (menos el arroba) -->
        <form class="auth-card" id="editDataForm">
            <h2>Editar Datos</h2>

            <p class="form-error" id="editDataError"></p>
            <p class="form-success" id="editDataSuccess"></p>

            <div class="form-group">
                <label for="firstname">Nombre</label>
                <input type="text" id="firstname" name="firstname">
            </div>

            <div class="form-group">
                <label for="lastname">Apellido</label>
                <input type="text" id="lastname" name="lastname">
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="editDataSubmit">Guardar Cambios</button>
        </form>

        <!-- Formulario para cambiar la contraseña -->
        <form class="auth-card" id="changePasswordForm">
            <h2>Cambiar Contraseña</h2>

            <p class="form-error" id="changePasswordError"></p>
            <p class="form-success" id="changePasswordSuccess"></p>

            <div class="form-group">
                <label for="current-password">Contraseña actual</label>
                <input type="password" id="current-password" name="current-password" placeholder="Ingresa tu contraseña actual">
            </div>

            <div class="form-group">
                <label for="new-password">Nueva contraseña</label>
                <input type="password" id="new-password" name="new-password" placeholder="Ingresa tu nueva contraseña">
            </div>

            <div class="form-group">
                <label for="repeat-password">Repetir nueva contraseña</label>
                <input type="password" id="repeat-password" name="repeat-password" placeholder="Repite tu nueva contraseña">
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="changePasswordSubmit">Actualizar Contraseña</button>
        </form>

    </main>

    <script src="./js/sidebar.js"></script>
    <script src="./js/data/mock-data.js"></script>
    <script src="./js/data/api.js"></script>
    <script src="./js/pages/profile.js"></script>
</body>
</html>
