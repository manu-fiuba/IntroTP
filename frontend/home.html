<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Home</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

    <!-- Tipografía Titillium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">

    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div> <!-- Overlay oscuro para el fondo -->

    <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="home" class="nav-link">Inicio</a>
            <a href="my-teams" class="nav-link">Equipos</a>
            <a href="leagues" class="nav-link">Ligas</a>
            <a href="rules" class="nav-link">Reglas</a>
            <a href="profile" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="/" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>
    
    <!-- Header -->
    <header class="app-header">
       <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Home</h1>
        <a href="profile" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="dashboard-container">
        
        <!-- Banner Próxima Carrera (se completa con home.js) -->
        <section class="next-race-banner" id="nextRaceBanner" style="display: none;">
            <div class="race-circuit-img">
                <img src="./img/circuit_monza.svg" alt="Circuito" id="raceCircuitImg">
            </div>
            
            <div class="race-info">
                <span class="round-badge" id="raceRound"></span>
                <h2 id="raceName"></h2>
                <p id="raceFullName"></p>
                <span class="race-date" id="raceDate"></span>
            </div>

            <div class="race-actions">
                <div class="countdown-panel">
                    <span class="countdown-label">Fecha límite para cerrar el equipo:</span>
                    <div class="countdown-timer">
                        <div class="time-box"><strong id="countdownDays">-</strong><span>DÍAS</span></div>
                        <span class="time-sep">:</span>
                        <div class="time-box"><strong id="countdownHours">-</strong><span>HORAS</span></div>
                        <span class="time-sep">:</span>
                        <div class="time-box"><strong id="countdownMinutes">-</strong><span>MIN</span></div>
                    </div>
                </div>
                <a href="my-teams" class="btn btn-primary">Gestiona tu equipo &rsaquo;</a>
            </div>
        </section>

        <!-- Sin equipos todavía -->
        <a href="create-team.html" class="team-card empty-slot" id="noTeamsMessage" style="display: none;">
            <div class="empty-content">
                <span class="plus-icon">+</span>
                <h3>Todavía no armaste ningún equipo</h3>
                <p>Creá tu primer equipo para empezar a jugar</p>
            </div>
        </a>

        <!-- Resultados Carreras Anteriores -->
        <div class="decorated-heading" id="lastRaceHeading" style="display: none;">
            <h2>Última carrera</h2>
            <span class="heading-tag" id="lastRaceTag"></span>
        </div>

        <section class="grid-3-cols" id="lastRaceTeams"></section>

        <!-- Estadísticas de Temporada -->
        <div class="decorated-heading" id="seasonStatsHeading" style="display: none;">
            <h2>Tus Estadísticas de Temporada</h2>
            <a href="my-teams" class="heading-btn">Mis Equipos &rsaquo;</a>
        </div>

        <section class="grid-3-cols" id="seasonStatsTeams"></section>

    </main>
    
    <script src="./js/sidebar.js"></script>
    <script src="./js/data/api.js"></script>
    <script src="./js/pages/home.js"></script>
</body>
</html>
