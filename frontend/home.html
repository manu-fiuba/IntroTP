<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Home</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

    <!-- Tipografía Titillium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">

    <!-- Menú Lateral -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div> <!-- Overlay oscuro para el fondo -->

    <aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header-menu">
            <button class="close-btn" id="closeSidebar" aria-label="Cerrar menú">
                <img src="./img/x.svg" alt="Cerrar" width="28" height="28">
            </button>
            <h2>Menú</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="home.html" class="nav-link">Inicio</a>
            <a href="my-teams.html" class="nav-link">Equipos</a>
            <a href="leagues.html" class="nav-link">Ligas</a>
            <a href="rules.html" class="nav-link">Reglas</a>
            <a href="profile.html" class="nav-link">Perfil</a>
            <div class="sidebar-divider"></div>
            <a href="index.html" class="nav-link logout-link">Cerrar Sesión</a>
        </nav>
    </aside>
    
    <!-- Header -->
    <header class="app-header">
       <button class="menu-btn" id="openSidebar" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Home</h1>
        <a href="profile.html" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="dashboard-container">
        
        <!-- Banner Próxima Carrera -->
        <section class="next-race-banner">
            <div class="race-circuit-img">
                <img src="./img/circuit_monza.svg" alt="Circuito de Monza">
            </div>
            
            <div class="race-info">
                <span class="round-badge">ROUND 11</span>
                <h2>Italia</h2>
                <p>FORMULA 2 PIRELLI GRAN PREMIO D'ITALIA 2026</p>
                <span class="race-date">04 - 06 Sep</span>
            </div>

            <div class="race-actions">
                <div class="countdown-panel">
                    <span class="countdown-label">Fecha límite para cerrar el equipo:</span>
                    <div class="countdown-timer">
                        <div class="time-box"><strong>24</strong><span>DÍAS</span></div>
                        <span class="time-sep">:</span>
                        <div class="time-box"><strong>13</strong><span>HORAS</span></div>
                        <span class="time-sep">:</span>
                        <div class="time-box"><strong>45</strong><span>MIN</span></div>
                    </div>
                </div>
                <a href="my-teams.html" class="btn btn-primary">Gestiona tu equipo &rsaquo;</a>
            </div>
        </section>

        <!-- Resultados Carreras Anteriores -->
        <div class="decorated-heading">
            <h2>Última carrera</h2>
            <span class="heading-tag">Hungría</span>
        </div>

        <section class="grid-3-cols" id="last-race-grid">
            <!-- JS inyectará las tarjetas acá -->
        </section>

        <!-- Estadísticas de Temporada -->
        <div class="decorated-heading">
            <h2>Tus Estadísticas de Temporada</h2>
            <a href="my-teams.html" class="heading-btn">Mis Equipos &rsaquo;</a>
        </div>

        <section class="grid-3-cols" id="season-stats-grid">
            <!-- JS inyectará las tarjetas acá -->
        </section>

    </main>
    
    <script src="./js/sidebar.js"></script>
    <script src="./js/data/mock-data.js"></script>
    <script src="./js/api-mock.js"></script>
    <script src="./js/pages/home.js"></script>
</body>
</html>
