<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Perfil</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">

    <!-- Tipografía Titillium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body">

    <!-- Header -->
    <header class="app-header">
        <button class="menu-btn" aria-label="Abrir menú">
            <img src="./img/menu.svg" alt="Menú" width="28" height="28">
        </button>
        <h1 class="header-title">Perfil</h1>
        <a href="home.html" class="profile-link">
            <img src="./img/circle-user.svg" alt="Perfil" class="pfp">
        </a>
    </header>

    <main class="profile-container">

        <!-- Box con foto, nombre y arroba -->
        <section class="profile-card">
            <img src="./img/circle-user.svg" alt="Foto de perfil" class="profile-avatar">
            <h2 class="profile-name">Nombre Apellido</h2>
            <span class="profile-username">@usuario</span>
        </section>

        <!-- Formulario para editar los datos (menos el arroba) -->
        <form class="auth-card">
            <h2>Editar Datos</h2>

            <div class="form-group">
                <label for="firstname">Nombre</label>
                <input type="text" id="firstname" name="firstname" value="Nombre">
            </div>

            <div class="form-group">
                <label for="lastname">Apellido</label>
                <input type="text" id="lastname" name="lastname" value="Apellido">
            </div>

            <div class="form-group">
                <label for="photo">Cambiar foto</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Guardar Cambios</button>
        </form>

        <!-- Formulario para cambiar la contraseña -->
        <form class="auth-card">
            <h2>Cambiar Contraseña</h2>

            <div class="form-group">
                <label for="current-password">Contraseña actual</label>
                <input type="password" id="current-password" name="current-password" placeholder="Ingresa tu contraseña actual">
            </div>

            <div class="form-group">
                <label for="new-password">Nueva contraseña</label>
                <input type="password" id="new-password" name="new-password" placeholder="Ingresa tu nueva contraseña">
            </div>

            <div class="form-group">
                <label for="repeat-password">Repetir nueva contraseña</label>
                <input type="password" id="repeat-password" name="repeat-password" placeholder="Repite tu nueva contraseña">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Actualizar Contraseña</button>
        </form>

    </main>

</body>
</html>
