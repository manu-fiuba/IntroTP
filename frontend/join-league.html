<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2 Fantasy | Unirse a Liga</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-body auth-layout">
    
    <main class="auth-container">
        
        <form class="auth-card" id="joinLeagueForm" action="leagues" autocomplete="off">

            <h2>Unirse a una Liga</h2>

            <p class="form-error" id="joinLeagueError"></p>
            
            <div class="form-group">
                <label for="join-code">Código de la Liga</label>
                <input type="text" id="join-code" name="join-code" placeholder="Ej: X89B26" required>
            </div>

            <div class="form-group">
                <label for="join-password">Contraseña de Acceso</label>
                <input type="password" id="join-password" name="join-password" placeholder="Dejar vacío si la liga es pública">
            </div>

            <div class="form-group">
                <label for="join-team">Equipo a utilizar</label>
                <select id="join-team" name="join-team" required
                    oninvalid="this.setCustomValidity('Elige un equipo')"
                    onchange="this.setCustomValidity('')">
                    <option value="" selected>Selecciona un equipo</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">

                <a href="leagues" class="btn btn-outline btn-full">Cancelar</a>
                <button type="submit" class="btn btn-primary btn-full" id="joinLeagueSubmit">Unirse</button>

            </div>
        </form>
    </main>

    <script src="./js/data/api.js"></script>
    <script src="./js/pages/join-league.js"></script>
</body>
</html>
